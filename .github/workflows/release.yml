name: Release

# Manual only. A run without `publish` checks, tests, packs and keeps the
# package but publishes nothing; with it, it also pushes the inspected package
# to NuGet.org through trusted publishing. TeachMeHipaa.csproj keeps
# <PublishGuard>true</PublishGuard> until launch, and the publish job refuses
# to run while it is set, so even a mistaken `publish` run publishes nothing
# (see CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet.org (refused while PublishGuard is true)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    outputs:
      publish-guard: ${{ steps.guard.outputs.publish-guard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # The contract suite runs Prism through npx.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: dotnet restore
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Generated code is current
        run: dotnet run --project tools/Generator -- --check
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Unit tests and README samples
        run: dotnet test --no-build --configuration Release
      - name: Contract tests
        run: dotnet test tests/TeachMeHipaa.ContractTests --configuration Release -p:ContractTests=true
      - name: Pack
        run: dotnet pack src/TeachMeHipaa --no-build --configuration Release --output nupkg
      - name: List the package's files
        run: unzip -l nupkg/*.nupkg
      - name: Read PublishGuard
        id: guard
        run: echo "publish-guard=$(dotnet msbuild src/TeachMeHipaa -getProperty:PublishGuard)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: nupkg/
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/TeachMeHipaa
    permissions:
      contents: read
      # NuGet trusted publishing exchanges this OIDC token for a short-lived
      # API key; no NuGet key is stored in the repository.
      id-token: write
    steps:
      - name: Refuse while PublishGuard is set
        env:
          PUBLISH_GUARD: ${{ needs.verify.outputs.publish-guard }}
        run: |
          if [ "$PUBLISH_GUARD" != "false" ]; then
            echo "::error::TeachMeHipaa.csproj has PublishGuard=$PUBLISH_GUARD; set it to false in the launch PR (CONTRIBUTING.md, Releasing)."
            exit 1
          fi
      # Publish exactly the files the verify job packed and listed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: nupkg/
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # The .snupkg next to the .nupkg is pushed to the symbol server with it.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
